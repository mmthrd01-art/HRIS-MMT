/* ============================================================
   UTIL — escaping (anti-XSS) & helpers
   ============================================================ */
function esc(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function fmtDate(ts) {
  if (!ts) return "-";
  const d = ts instanceof Timestamp ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString("id-ID", { day: "2-digit", month: "long", year: "numeric" });
}

function fmtDateTime(ts) {

function toast(msg, type = "info") {
  const el = document.createElement("div");
  const color = type === "error" ? "bg-red-600" : type === "success" ? "bg-emerald-600" : "bg-slate-900";
  el.className = `fixed bottom-4 right-4 ${color} text-white text-sm px-4 py-2.5 rounded-lg shadow-lg z-50 fade-in`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function exportCsv(rows, filename) {
  if (!rows.length) { toast("Tidak ada data untuk diekspor.", "error"); return; }
  const headers = Object.keys(rows[0]);
  const csvRows = [headers.join(",")];
  rows.forEach((r) => {
    csvRows.push(headers.map((h) => `"${String(r[h] ?? "").replaceAll('"', '""')}"`).join(","));
  });
  const blob = new Blob([csvRows.join("\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

async function imageUrlToDataUrl(url) {
  const res = await fetch(url);
  const blob = await res.blob();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// Penomoran dokumen sekuensial & atomik via Firestore transaction (mis. KONTRAK/2026/0001).
// Mencegah dua HRD membuat nomor yang sama saat input bersamaan.
async function nextDocNumber(counterKey, prefix) {
  const counterRef = doc(db, "counters", counterKey);
  const seq = await runTransaction(db, async (tx) => {
    const snap = await tx.get(counterRef);
    const current = snap.exists() ? (snap.data().seq || 0) : 0;
    const next = current + 1;
    tx.set(counterRef, { seq: next }, { merge: true });
    return next;
  });
  const year = new Date().getFullYear();
  return `${prefix}/${year}/${String(seq).padStart(4, "0")}`;
}

// Komponen tanda tangan digital berbasis canvas (mouse + touchscreen).
function mountSignaturePad(canvas) {
  const ctx = canvas.getContext("2d");
  ctx.strokeStyle = "#0f172a";
  ctx.lineWidth = 2.2;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  let drawing = false, last = null;

  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - rect.left) * (canvas.width / rect.width), y: (cy - rect.top) * (canvas.height / rect.height) };
  }
  function start(e) { drawing = true; last = pos(e); }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p;
  }
  function end() { drawing = false; }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  window.addEventListener("mouseup", end);
  canvas.addEventListener("touchstart", start, { passive: false });
  canvas.addEventListener("touchmove", move, { passive: false });
  canvas.addEventListener("touchend", end);

  return {
    clear: () => ctx.clearRect(0, 0, canvas.width, canvas.height),
    isEmpty: () => {
      const blank = document.createElement("canvas");
      blank.width = canvas.width; blank.height = canvas.height;
      return canvas.toDataURL() === blank.toDataURL();
    },
    toDataURL: () => canvas.toDataURL("image/png"),
  };
}

const USERNAME_DOMAIN = "mmt-hris.local";

function sanitizeUsername(raw) {
  return (raw || "").trim().toLowerCase().replace(/[^a-z0-9._-]/g, "");
}
function usernameToEmail(username) {
  return `${username}@${USERNAME_DOMAIN}`;
}

// Mengganti username sendiri (atau, jika dipanggil SUPER_ADMIN, username user lain).
// Email Auth asli tidak berubah — hanya mapping usernames/{username} -> {uid, email} yang dipindah.
async function changeUsername(uid, oldUsername, newUsernameRaw) {
  const newUsername = sanitizeUsername(newUsernameRaw);
  if (!newUsername || newUsername.length < 3) throw new Error("Username minimal 3 karakter (huruf/angka/._-).");
  if (newUsername === oldUsername) return newUsername;

  await runTransaction(db, async (tx) => {
    const newRef = doc(db, "usernames", newUsername);
    const newSnap = await tx.get(newRef);
    if (newSnap.exists()) throw new Error("Username sudah dipakai orang lain.");

    const oldRef = doc(db, "usernames", oldUsername);
    const oldSnap = await tx.get(oldRef);
    const mapping = oldSnap.exists() ? oldSnap.data() : { uid, email: usernameToEmail(oldUsername) };

    tx.set(newRef, mapping);
    tx.delete(oldRef);
    tx.update(doc(db, "users", uid), { username: newUsername });
  });
  return newUsername;
}

// Ganti password akun SENDIRI (butuh password lama untuk re-autentikasi — standar keamanan Firebase,
// mencegah orang yang sekadar menemukan sesi login terbuka bisa mengganti password tanpa tahu password lama).
async function changeOwnPassword(oldPassword, newPassword) {
  if (newPassword.length < 6) throw new Error("Password baru minimal 6 karakter (ketentuan Firebase Authentication).");
  const cred = EmailAuthProvider.credential(state.user.email, oldPassword);
  await reauthenticateWithCredential(state.user, cred);
  await updatePassword(state.user, newPassword);
}

}

  else if (base === "calendar") content = await viewCalendar();
  else if (base === "reports") content = await viewReports();
  else if (base === "settings") content = await viewCompanySettings();
  else if (base === "users") content = await viewUsersAdmin();
  else if (base === "profile") content = viewProfile();
  else content = `<p class="text-sm text-slate-500">Halaman tidak ditemukan.</p>`;

  renderShell(content);
  afterRenderHooks();
}

        const mapSnap = await getDoc(doc(db, "usernames", username));

  let snap;

function hookCompanySettings() {
  const form = document.getElementById("companyForm");
  if (!form) return;

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const fields = ["name","shortName","businessType","address","email","phone","whatsapp","website","directorName"];
    const before = { ...state.company };
    const data = {};
    fields.forEach((f) => { data[f] = document.getElementById(`f_${f}`).value.trim(); });
    data.updatedAt = serverTimestamp();

    try {
      await updateDoc(doc(db, "companySettings", "main"), data);
      state.company = { ...state.company, ...data };
      await logAudit("EDIT", "CompanySettings", "main", { before, after: data });
      toast("Perubahan tersimpan.", "success");
      render();
    } catch (err) {
      console.error(err);
      toast("Gagal menyimpan: " + err.message, "error");
    }
  });

  const logoInput = document.getElementById("logoInput");
  logoInput?.addEventListener("change", async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const allowed = ["image/png", "image/jpeg", "image/webp"];
    if (!allowed.includes(file.type)) {
      toast("Format tidak didukung. Gunakan PNG, JPG, atau WEBP.", "error");
      return;
    }
    if (file.size > 2 * 1024 * 1024) {
      toast("Ukuran file maksimal 2MB.", "error");
      return;
    }

    try {
      const path = `branding/logo-${Date.now()}-${file.name}`;
      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, file);
      const url = await getDownloadURL(storageRef);

      const before = state.company?.logoUrl || null;
      await updateDoc(doc(db, "companySettings", "main"), { logoUrl: url, updatedAt: serverTimestamp() });
      state.company.logoUrl = url;
      await logAudit("UPLOAD", "CompanySettings.logo", "main", { before, after: url });
      toast("Logo berhasil diperbarui.", "success");
      render();

/* ============================================================
   DASHBOARD — angka nyata dari Firestore, bukan mockup
   ============================================================ */
async function viewDashboard() {
  const [empSnap, contractSnap, candidateSnap, disciplineSnap] = await Promise.all([
    getDocs(collection(db, "employees")),
    getDocs(collection(db, "contracts")),
    getDocs(collection(db, "candidates")),
    getDocs(collection(db, "disciplinaryActions")),
  ]);

  const counts = { total: 0, TRAINING: 0, PKWT: 0, TETAP: 0, RESIGN: 0, PHK: 0 };
  empSnap.forEach((d) => {
    const s = d.data().status || "TRAINING";
    counts.total++;
    if (counts[s] !== undefined) counts[s]++;
  });

  const cards = [
    ["Total Karyawan", counts.total], ["Training", counts.TRAINING], ["PKWT", counts.PKWT],
    ["Tetap", counts.TETAP], ["Resign", counts.RESIGN], ["PHK", counts.PHK],
  ];

  // Contract Alert — dihitung langsung dari tanggal berakhir kontrak (real-time, tanpa Cloud Function).
  const today = new Date();
  const contracts = [];
  contractSnap.forEach((d) => contracts.push({ id: d.id, ...d.data() }));
  const activeContracts = contracts.filter((c) => c.status === "AKTIF");
  const daysUntil = (dateStr) => Math.ceil((new Date(dateStr) - today) / 86400000);
  const expiring30 = activeContracts.filter((c) => c.endDate && daysUntil(c.endDate) <= 30 && daysUntil(c.endDate) >= 0);
  const expiring14 = expiring30.filter((c) => daysUntil(c.endDate) <= 14);
  const expiring7 = expiring30.filter((c) => daysUntil(c.endDate) <= 7);
  const waitingSign = contracts.filter((c) => c.status === "MENUNGGU_TTD");

  const candidatesToday = [];
  candidateSnap.forEach((d) => { if (!["CONVERTED", "DITOLAK"].includes(d.data().status)) candidatesToday.push(d.data()); });

  let sp1Active = 0, sp2Active = 0;
  disciplineSnap.forEach((d) => { const a = d.data().action; if (a === "SP1") sp1Active++; if (a === "SP2") sp2Active++; });

  const actionItems = [];
  if (expiring7.length) actionItems.push(`⚠️ ${expiring7.length} kontrak berakhir dalam 7 hari.`);
  if (waitingSign.length) actionItems.push(`🔔 ${waitingSign.length} dokumen menunggu tanda tangan.`);
  if (candidatesToday.length) actionItems.push(`🧑‍💼 ${candidatesToday.length} kandidat masih dalam proses recruiting.`);
  if (!actionItems.length) actionItems.push("✅ Tidak ada tindakan mendesak saat ini.");

  return `
    <div class="space-y-6">
      <div>
        <h1 class="text-xl font-semibold">Dashboard</h1>
        <p class="text-sm text-slate-500">Ringkasan operasional HRD (live dari Firestore).</p>
      </div>

      <section>
        <h2 class="text-sm font-semibold text-slate-700 mb-3">Data Karyawan</h2>
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
          ${cards.map(([label, value]) => `
            <div class="bg-white rounded-xl border border-slate-200 p-4">
              <p class="text-2xl font-semibold">${value}</p>
              <p class="text-xs text-slate-500 mt-1">${esc(label)}</p>
            </div>
          `).join("")}
        </div>
      </section>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <section class="bg-white rounded-xl border border-slate-200 p-5">
          <h2 class="text-sm font-semibold mb-3">Contract Alert</h2>
          <dl class="grid grid-cols-2 gap-3 text-sm">
            <div><dt class="text-slate-400">Kontrak Aktif</dt><dd class="text-lg font-semibold">${activeContracts.length}</dd></div>
            <div><dt class="text-slate-400">Berakhir &lt;30 hari</dt><dd class="text-lg font-semibold">${expiring30.length}</dd></div>
            <div><dt class="text-slate-400">Berakhir &lt;14 hari</dt><dd class="text-lg font-semibold">${expiring14.length}</dd></div>
            <div><dt class="text-slate-400">Berakhir &lt;7 hari</dt><dd class="text-lg font-semibold">${expiring7.length}</dd></div>
          </dl>
          ${expiring30.length ? `
            <ul class="mt-3 space-y-1 text-xs text-slate-500">
              ${expiring30.slice(0, 5).map((c) => `<li>• ${esc(c.employeeName)} — sisa ${daysUntil(c.endDate)} hari <a href="#/contracts/${c.id}" class="text-slate-900 underline">lihat</a></li>`).join("")}
            </ul>
          ` : ""}
        </section>

        <section class="bg-white rounded-xl border border-slate-200 p-5">
          <h2 class="text-sm font-semibold mb-3">Discipline</h2>
          <dl class="grid grid-cols-2 gap-3 text-sm">
            <div><dt class="text-slate-400">SP1 Aktif</dt><dd class="text-lg font-semibold">${sp1Active}</dd></div>
            <div><dt class="text-slate-400">SP2 Aktif</dt><dd class="text-lg font-semibold">${sp2Active}</dd></div>
          </dl>
        </section>
      </div>

      <section class="bg-white rounded-xl border border-slate-200 p-5">
        <h2 class="text-sm font-semibold mb-3">Action Required</h2>
        <ul class="space-y-1.5 text-sm">
          ${actionItems.map((a) => `<li>${esc(a)}</li>`).join("")}
        </ul>
      </section>
    </div>
  `;
}

      await addDoc(collection(db, "employees", empRef.id, "timeline"), {
        category: "STATUS_CHANGE", icon: "🟢",
        title: `Bergabung sebagai ${empData.position} (convert dari kandidat)`,
        createdAt: serverTimestamp(), createdBy: state.user.uid,
      });
      await updateDoc(doc(db, "candidates", id), { status: "CONVERTED", employeeId: empRef.id });

      toast("Kandidat berhasil menjadi karyawan.", "success");
      location.hash = `#/employees/${empRef.id}`;
    } catch (err) { toast("Gagal convert: " + err.message, "error"); }
  });

function hookContractDetail() {
  const id = currentRoute().split("/")[1];
  const contractRoot = document.getElementById("downloadPdfBtn");
  if (!contractRoot) return;

  let padEmployee, padDirector;
  const canvasEmployee = document.getElementById("padEmployee");
  const canvasDirector = document.getElementById("padDirector");
  if (canvasEmployee) padEmployee = mountSignaturePad(canvasEmployee);
  if (canvasDirector) padDirector = mountSignaturePad(canvasDirector);

  document.getElementById("clearPadEmployee")?.addEventListener("click", () => padEmployee.clear());
  document.getElementById("clearPadDirector")?.addEventListener("click", () => padDirector.clear());

  document.getElementById("saveSigEmployee")?.addEventListener("click", async () => {
    if (padEmployee.isEmpty()) { toast("Tanda tangan belum digambar.", "error"); return; }
    try {
      const snap = await getDoc(doc(db, "contracts", id));
      const c = snap.data();
      await updateDoc(doc(db, "contracts", id), {
        employeeSignature: { image: padEmployee.toDataURL(), name: c.employeeName, signedAt: new Date().toISOString(), ipDevice: navigator.userAgent },
      });
      await logAudit("SIGN", "Contract", id, { by: "employee" });
      toast("Tanda tangan karyawan tersimpan.", "success");
      render();
    } catch (err) { toast("Gagal: " + err.message, "error"); }
  });

  document.getElementById("saveSigDirector")?.addEventListener("click", async () => {
    if (padDirector.isEmpty()) { toast("Tanda tangan belum digambar.", "error"); return; }
    try {
      await updateDoc(doc(db, "contracts", id), {
        directorSignature: { image: padDirector.toDataURL(), name: state.company.directorName, signedAt: new Date().toISOString(), ipDevice: navigator.userAgent },
      });
      await logAudit("SIGN", "Contract", id, { by: "director" });
      toast("Tanda tangan direktur tersimpan.", "success");
      render();
    } catch (err) { toast("Gagal: " + err.message, "error"); }
  });

  document.getElementById("advanceStatusBtn")?.addEventListener("click", async (e) => {
    const next = e.target.dataset.next;
    try {
      await updateDoc(doc(db, "contracts", id), { status: next });
      await logAudit("CHANGE_STATUS", "Contract", id, { newStatus: next });
      toast("Status kontrak diperbarui.", "success");
      render();
    } catch (err) { toast("Gagal: " + err.message, "error"); }
  });

  document.getElementById("finalizeBtn")?.addEventListener("click", async () => {
    if (!confirm("Setelah final, isi kontrak tidak bisa diedit lagi. Lanjutkan?")) return;
    try {
      await updateDoc(doc(db, "contracts", id), { status: "AKTIF", finalizedAt: serverTimestamp() });
      const snap = await getDoc(doc(db, "contracts", id));
      const c = snap.data();
      await addDoc(collection(db, "employees", c.employeeId, "timeline"), {
        category: "CONTRACT", icon: "✍️", title: `Kontrak ${c.contractNo} final & ditandatangani`,
        refType: "Contract", refId: id, createdAt: serverTimestamp(), createdBy: state.user.uid,
      });
      await updateDoc(doc(db, "employees", c.employeeId), { status: c.type === "PKWT" ? "PKWT" : "TRAINING" });
      await logAudit("APPROVE", "Contract", id, { status: "AKTIF" });
      toast("Kontrak final.", "success");
      render();
    } catch (err) { toast("Gagal: " + err.message, "error"); }
  });

  document.getElementById("cancelContractBtn")?.addEventListener("click", async () => {
    if (!confirm("Batalkan kontrak ini?")) return;
    try {
      await updateDoc(doc(db, "contracts", id), { status: "DIBATALKAN" });
      await logAudit("CHANGE_STATUS", "Contract", id, { newStatus: "DIBATALKAN" });
      toast("Kontrak dibatalkan.", "success");
      render();
    } catch (err) { toast("Gagal: " + err.message, "error"); }
  });

  document.getElementById("downloadPdfBtn").addEventListener("click", async () => {
    try {
      const snap = await getDoc(doc(db, "contracts", id));
      const c = { id, ...snap.data() };
      const empSnap = await getDoc(doc(db, "employees", c.employeeId));
      await generateContractPdf(c, empSnap.data());
    } catch (err) { toast("Gagal membuat PDF: " + err.message, "error"); }
  });
}

async function generateContractPdf(contract, employee) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: "mm", format: "a4" });
  let y = 15;
  const company = state.company || {};

  if (company.logoUrl) {
    try { const logoData = await imageUrlToDataUrl(company.logoUrl); pdf.addImage(logoData, "PNG", 15, y, 18, 18); } catch {}
  }
  pdf.setFontSize(12); pdf.setFont(undefined, "bold");
  pdf.text(company.name || "CV. MITRA MULTI TEKNIK", 38, y + 5);
  pdf.setFont(undefined, "normal"); pdf.setFontSize(8);
  pdf.text(company.businessType || "", 38, y + 10);
  pdf.text(pdf.splitTextToSize(company.address || "", 150), 38, y + 14);
  y += 28;
  pdf.setLineWidth(0.5); pdf.line(15, y, 195, y);
  y += 8;

  pdf.setFontSize(11); pdf.setFont(undefined, "bold");
  pdf.text(`SURAT PERJANJIAN KERJA — ${contract.type}`, 105, y, { align: "center" });
  y += 5;
  pdf.setFont(undefined, "normal"); pdf.setFontSize(9);
  pdf.text(`Nomor: ${contract.contractNo}`, 105, y, { align: "center" });
  y += 10;

  pdf.setFontSize(10);
  const lines = pdf.splitTextToSize(contract.content || "", 180);
  pdf.text(lines, 15, y);
  y += lines.length * 4.6 + 12;
  if (y > 220) { pdf.addPage(); y = 20; }

  const sigY = y;
  if (contract.employeeSignature?.image) pdf.addImage(contract.employeeSignature.image, "PNG", 20, sigY, 45, 22);
  pdf.setFontSize(9);
  pdf.text(employee?.fullName || contract.employeeName, 20, sigY + 27);
  pdf.text("Karyawan", 20, sigY + 32);

  if (contract.directorSignature?.image) pdf.addImage(contract.directorSignature.image, "PNG", 135, sigY, 45, 22);
  pdf.text(company.directorName || "-", 135, sigY + 27);
  pdf.text("Direktur", 135, sigY + 32);

  y = sigY + 42;
  try {
    const verifyUrl = `${location.origin}${location.pathname}#/contracts/${contract.id}`;
    const qrData = await window.QRCode.toDataURL(verifyUrl, { margin: 1, width: 200 });
    pdf.addImage(qrData, "PNG", 88, y, 24, 24);
    pdf.setFontSize(7);
    pdf.text("Scan untuk verifikasi dokumen digital", 100, y + 27, { align: "center" });
  } catch {}

  pdf.save(`Kontrak-${contract.contractNo.replaceAll("/", "-")}.pdf`);
}

async function generateWarningPdf(w) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: "mm", format: "a4" });
  const company = state.company || {};
  let y = 15;

  if (company.logoUrl) { try { const logoData = await imageUrlToDataUrl(company.logoUrl); pdf.addImage(logoData, "PNG", 15, y, 18, 18); } catch {} }
  pdf.setFontSize(12); pdf.setFont(undefined, "bold");
  pdf.text(company.name || "CV. MITRA MULTI TEKNIK", 38, y + 5);
  pdf.setFont(undefined, "normal"); pdf.setFontSize(8);
  pdf.text(company.address || "", 38, y + 10);
  y += 26; pdf.line(15, y, 195, y); y += 10;

  pdf.setFontSize(12); pdf.setFont(undefined, "bold");
  pdf.text(`SURAT PERINGATAN ${w.level}`, 105, y, { align: "center" });
  y += 5; pdf.setFont(undefined, "normal"); pdf.setFontSize(9);
  pdf.text(`Nomor: ${w.letterNo}`, 105, y, { align: "center" });
  y += 12;

  pdf.setFontSize(10);
  pdf.text(`Yang bertanda tangan di bawah ini, manajemen ${company.name}, dengan ini memberikan`, 15, y); y += 6;
  pdf.text(`${w.level} kepada:`, 15, y); y += 8;
  pdf.text(`Nama    : ${w.employeeName}`, 20, y); y += 6;
  pdf.text(`Tanggal : ${fmtDate(w.date)}`, 20, y); y += 10;
  pdf.text("Alasan/Pelanggaran:", 15, y); y += 6;
  const lines = pdf.splitTextToSize(w.reason || "-", 180);
  pdf.text(lines, 15, y); y += lines.length * 5 + 15;

  if (w.signature?.image) pdf.addImage(w.signature.image, "PNG", 140, y, 40, 20);
  pdf.text(company.directorName || "-", 140, y + 25);
  pdf.text("Direktur/HRD", 140, y + 30);

  try {
    const verifyUrl = `${location.origin}${location.pathname}#/warning/${w.id}`;
    const qrData = await window.QRCode.toDataURL(verifyUrl, { margin: 1, width: 200 });
    pdf.addImage(qrData, "PNG", 20, y, 22, 22);
  } catch {}

  pdf.save(`${w.level}-${w.letterNo.replaceAll("/", "-")}.pdf`);
}

function hookExitDetail() {
  document.querySelectorAll(".clearanceCheck").forEach((cb) => {
    cb.addEventListener("change", async () => {
      const compositeId = currentRoute().split("/")[1];
      const isResign = compositeId.startsWith("resign-");
      const id = compositeId.replace(/^(resign|phk)-/, "");
      const coll = isResign ? "resignations" : "terminations";
      const snap = await getDoc(doc(db, coll, id));
      const data = snap.data();
      const checklist = data.exitChecklist || {};
      checklist[cb.dataset.group] = checklist[cb.dataset.group] || {};
      checklist[cb.dataset.group][cb.dataset.item] = cb.checked;
      await updateDoc(doc(db, coll, id), { exitChecklist: checklist });
    });
  });

  document.getElementById("exitAdvanceBtn")?.addEventListener("click", async (e) => {
    const coll = e.target.dataset.coll;
    const next = e.target.dataset.next;
    const compositeId = currentRoute().split("/")[1];
    const id = compositeId.replace(/^(resign|phk)-/, "");
    try {
      await updateDoc(doc(db, coll, id), { status: next });
      if (next === "SELESAI") {
        const snap = await getDoc(doc(db, coll, id));
        const d = snap.data();
        const newEmpStatus = coll === "resignations" ? "RESIGN" : "PHK";
        await updateDoc(doc(db, "employees", d.employeeId), { status: newEmpStatus, isActive: false, exitDate: new Date().toISOString().slice(0, 10) });
        await addDoc(collection(db, "employees", d.employeeId, "timeline"), {
          category: "STATUS_CHANGE", icon: coll === "resignations" ? "🟡" : "⚫",
          title: `Status berubah menjadi ${newEmpStatus}`, createdAt: serverTimestamp(), createdBy: state.user.uid,
        });
      }
      await logAudit("CHANGE_STATUS", coll === "resignations" ? "Resignation" : "Termination", id, { newStatus: next });
      toast("Status diperbarui.", "success");
      render();
    } catch (err) { toast("Gagal: " + err.message, "error"); }
  });
}

/* ============================================================
   CALENDAR — gabungan event kontrak (otomatis) + event manual
   ============================================================ */
async function viewCalendar() {
  const canManage = can("calendar.manage") || can("*");
  const [contractSnap, eventSnap] = await Promise.all([
    getDocs(query(collection(db, "contracts"), where("status", "==", "AKTIF"))),
    getDocs(query(collection(db, "calendarEvents"), orderBy("date", "asc"))),
  ]);

  const items = [];
  contractSnap.forEach((d) => {
    const c = d.data();
    if (c.endDate) items.push({ date: c.endDate, icon: "🟠", title: `Kontrak berakhir — ${c.employeeName}`, link: `#/contracts/${d.id}` });
  });
  eventSnap.forEach((d) => { const e = d.data(); items.push({ date: e.date, icon: e.icon || "🟣", title: e.title, id: d.id }); });
  items.sort((a, b) => new Date(a.date) - new Date(b.date));

  return `
    <div class="space-y-6">
      <div class="flex items-center justify-between">
        <div><h1 class="text-xl font-semibold">Kalender HR</h1><p class="text-sm text-slate-500">Agenda gabungan kontrak & event HR.</p></div>
      </div>

      ${canManage ? `
        <form id="calendarEventForm" class="bg-white rounded-xl border border-slate-200 p-5 flex flex-wrap gap-3 items-end">
          <div><label class="block text-xs font-medium mb-1">Judul</label><input id="f_ceTitle" required class="rounded-lg border border-slate-300 px-3 py-2 text-sm" /></div>
          <div><label class="block text-xs font-medium mb-1">Tanggal</label><input id="f_ceDate" type="date" required class="rounded-lg border border-slate-300 px-3 py-2 text-sm" /></div>
          <div>
            <label class="block text-xs font-medium mb-1">Kategori</label>
            <select id="f_ceCategory" class="rounded-lg border border-slate-300 px-3 py-2 text-sm">
              <option value="MEETING">🟢 Meeting</option><option value="EVENT_HR">🟣 Event HR</option><option value="INTERVIEW">🔵 Interview</option>
            </select>
          </div>
          <button type="submit" class="rounded-lg bg-slate-900 text-white text-sm font-medium px-4 py-2 hover:bg-slate-800">+ Tambah Event</button>
        </form>
      ` : ""}

      <section class="bg-white rounded-xl border border-slate-200 p-5">
        ${items.length === 0 ? `<p class="text-sm text-slate-400">Tidak ada agenda.</p>` : `
          <ol class="space-y-3">
            ${items.map((i) => `
              <li class="flex items-center gap-3 text-sm border-b border-slate-100 pb-2">
                <span>${i.icon}</span>
                <span class="text-slate-400 w-28 shrink-0">${fmtDate(i.date)}</span>
                ${i.link ? `<a href="${i.link}" class="hover:underline">${esc(i.title)}</a>` : `<span>${esc(i.title)}</span>`}
              </li>
            `).join("")}
          </ol>
        `}
      </section>
    </div>
  `;
}

function hookCalendar() {
  const form = document.getElementById("calendarEventForm");
  form?.addEventListener("submit", async (e) => {
    e.preventDefault();
    try {
      await addDoc(collection(db, "calendarEvents"), {
        title: document.getElementById("f_ceTitle").value.trim(),
        date: document.getElementById("f_ceDate").value,
        category: document.getElementById("f_ceCategory").value,
        icon: { MEETING: "🟢", EVENT_HR: "🟣", INTERVIEW: "🔵" }[document.getElementById("f_ceCategory").value],
        createdAt: serverTimestamp(), createdBy: state.user.uid,
      });
      await logAudit("CREATE", "CalendarEvent", null, {});
      toast("Event ditambahkan.", "success");
      render();
    } catch (err) { toast("Gagal: " + err.message, "error"); }
  });
}

/* ============================================================
   REPORTS
   ============================================================ */
async function viewReports() {
  return `
    <div class="max-w-2xl space-y-6">
      <div><h1 class="text-xl font-semibold">Laporan</h1><p class="text-sm text-slate-500">Export data langsung dari database ke CSV (bisa dibuka di Excel).</p></div>
      <div class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100">
        ${[
          ["Data Karyawan", "employees"], ["Kontrak", "contracts"], ["Evaluasi Training", "evaluations"],
          ["Item Cut Off", "payrollItems"], ["Pelanggaran & SP", "disciplinaryActions"], ["Recruiting", "candidates"],
        ].map(([label, coll]) => `
          <div class="flex items-center justify-between p-4">
            <span class="text-sm font-medium">${label}</span>
            <button data-coll="${coll}" data-label="${label}" class="exportBtn text-sm rounded-lg border border-slate-300 px-3 py-1.5 hover:bg-slate-50">⬇️ Export CSV</button>
          </div>
        `).join("")}
      </div>
    </div>
  `;
}

function hookReports() {
  document.querySelectorAll(".exportBtn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const snap = await getDocs(collection(db, btn.dataset.coll));
      const rows = [];
      snap.forEach((d) => {
        const data = d.data();
        const flat = {};
        Object.entries(data).forEach(([k, v]) => {
          if (v && typeof v === "object" && !(v instanceof Array)) flat[k] = JSON.stringify(v);
          else flat[k] = v;
        });
        rows.push(flat);
      });
      exportCsv(rows, `${btn.dataset.coll}.csv`);
      await logAudit("DOWNLOAD", "Report", null, { report: btn.dataset.coll });
    });
  });
}

/* ============================================================
   PROFIL SAYA — ubah username & password sendiri
   ============================================================ */
function viewProfile() {
  const p = state.profile || {};
  return `
    <div class="max-w-md space-y-6">
      <div>
        <h1 class="text-xl font-semibold">Profil Saya</h1>
        <p class="text-sm text-slate-500">${esc(p.name)} · ${esc(p.role)}</p>
      </div>

      <form id="usernameForm" class="bg-white rounded-xl border border-slate-200 p-5 space-y-4">
        <h2 class="text-sm font-semibold">Ubah Username</h2>
        <p class="text-xs text-slate-500">Username saat ini: <b>${esc(p.username || "-")}</b></p>
        <div>
          <label class="block text-sm font-medium mb-1">Username Baru</label>
          <input id="newUsername" type="text" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="huruf/angka/._- , min 3 karakter" />
        </div>
        <button type="submit" class="rounded-lg bg-slate-900 text-white text-sm font-medium px-4 py-2 hover:bg-slate-800">Simpan Username</button>
      </form>

      <form id="passwordForm" class="bg-white rounded-xl border border-slate-200 p-5 space-y-4">
        <h2 class="text-sm font-semibold">Ubah Password</h2>
        <div>
          <label class="block text-sm font-medium mb-1">Password Saat Ini</label>
          <input id="oldPassword" type="password" required autocomplete="current-password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Password Baru</label>
          <input id="newPassword" type="password" required minlength="6" autocomplete="new-password" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
          <p class="text-xs text-slate-400 mt-1">Minimal 6 karakter (ketentuan keamanan Firebase Authentication).</p>
        </div>
        <button type="submit" class="rounded-lg bg-slate-900 text-white text-sm font-medium px-4 py-2 hover:bg-slate-800">Simpan Password</button>
      </form>
    </div>
  `;
}

function hookProfile() {
  const usernameForm = document.getElementById("usernameForm");
  usernameForm?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const newUsernameRaw = document.getElementById("newUsername").value;
    try {
      const newUsername = await changeUsername(state.user.uid, state.profile.username, newUsernameRaw);
      state.profile.username = newUsername;
      await logAudit("EDIT", "User.username", state.user.uid, { newUsername });
      toast("Username berhasil diperbarui. Gunakan username baru saat login berikutnya.", "success");
      render();
    } catch (err) {
      toast(err.message, "error");
    }
  });

  const passwordForm = document.getElementById("passwordForm");
  passwordForm?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const oldPassword = document.getElementById("oldPassword").value;
    const newPassword = document.getElementById("newPassword").value;
    try {
      await changeOwnPassword(oldPassword, newPassword);
      await logAudit("EDIT", "User.password", state.user.uid, {});
      toast("Password berhasil diperbarui.", "success");
      passwordForm.reset();
    } catch (err) {
      const msg = mapAuthError(err.code) || err.message;
      toast(msg, "error");
    }
  });
}

/* ============================================================
   USER MANAGEMENT (SUPER_ADMIN) — approve & set role
   ============================================================ */
async function viewUsersAdmin() {
  if (!can("*")) return `<p class="text-sm text-red-600">Hanya Super Admin yang dapat mengakses halaman ini.</p>`;

  const snap = await getDocs(query(collection(db, "users"), orderBy("createdAt", "desc")));
  const rows = [];
  snap.forEach((d) => rows.push({ id: d.id, ...d.data() }));

  return `
    <div class="space-y-4">
      <div>
        <h1 class="text-xl font-semibold">Manajemen User</h1>
        <p class="text-sm text-slate-500">Aktifkan akun baru & tetapkan role.</p>
        <p class="text-xs text-amber-600 bg-amber-50 border border-amber-200 rounded-lg p-3 mt-2 max-w-xl">
          Catatan: Super Admin bisa mengaktifkan akun & mengganti role di sini. Untuk keamanan,
          <b>password hanya bisa diganti oleh pemilik akun sendiri</b> lewat menu "Profil Saya"
          setelah login — Firebase Authentication tidak mengizinkan admin mengubah password user
          lain langsung dari browser.
        </p>
      </div>
      <div class="bg-white rounded-xl border border-slate-200 overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-slate-50 text-slate-500 text-left">
            <tr>
              <th class="px-4 py-2 font-medium">Nama</th>
              <th class="px-4 py-2 font-medium">Username</th>
              <th class="px-4 py-2 font-medium">Role</th>
              <th class="px-4 py-2 font-medium">Status</th>
              <th class="px-4 py-2 font-medium">Aksi</th>
            </tr>
          </thead>
          <tbody>
            ${rows.map((r) => `
              <tr class="border-t border-slate-100">
                <td class="px-4 py-2.5">${esc(r.name)}</td>
                <td class="px-4 py-2.5 text-slate-500">${esc(r.username || "-")}</td>
                <td class="px-4 py-2.5">
                  <select data-uid="${r.id}" class="roleSelect rounded border border-slate-300 text-xs px-2 py-1">
                    ${ROLES.map((role) => `<option value="${role}" ${r.role === role ? "selected" : ""}>${role}</option>`).join("")}
                    <option value="PENDING" ${r.role === "PENDING" ? "selected" : ""}>PENDING</option>
                  </select>
                </td>
                <td class="px-4 py-2.5">
                  <span class="inline-block rounded-full px-2 py-0.5 text-xs ${r.isActive ? "bg-emerald-100 text-emerald-700" : "bg-amber-100 text-amber-700"}">
                    ${r.isActive ? "Aktif" : "Nonaktif"}
                  </span>
                </td>
                <td class="px-4 py-2.5">
                  <button data-uid="${r.id}" data-active="${!r.isActive}" class="toggleActiveBtn text-xs font-medium ${r.isActive ? "text-red-600" : "text-emerald-600"}">
                    ${r.isActive ? "Nonaktifkan" : "Aktifkan"}
                  </button>
                </td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function hookUsersAdmin() {
  document.querySelectorAll(".roleSelect").forEach((sel) => {
    sel.addEventListener("change", async () => {
      const uid = sel.dataset.uid;
      const newRole = sel.value;
      try {
        await updateDoc(doc(db, "users", uid), { role: newRole });
        await logAudit("CHANGE_STATUS", "User.role", uid, { newRole });
        toast("Role diperbarui.", "success");
      } catch (err) {
        toast("Gagal: " + err.message, "error");
      }
    });
  });

  document.querySelectorAll(".toggleActiveBtn").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const uid = btn.dataset.uid;
      const newActive = btn.dataset.active === "true";
      try {
        await updateDoc(doc(db, "users", uid), { isActive: newActive });
        await logAudit("CHANGE_STATUS", "User.isActive", uid, { newActive });
        toast(newActive ? "Akun diaktifkan." : "Akun dinonaktifkan.", "success");
        render();
      } catch (err) {
        toast("Gagal: " + err.message, "error");
      }
    });
  });
}
